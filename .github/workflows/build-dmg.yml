name: Build DMG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # attach DMG to release on v* tags
  pull-requests: write  # post build log to PR on failure
  issues: write         # pull-request comments go through the issues API

jobs:
  build:
    name: Build PDFHandler.dmg
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p

      - name: Run tests
        run: |
          cd PDFHandler
          swift test

      - name: Build DMG (capturing log)
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/build-dmg.sh 2>&1 | tee build/build.log

      - name: Publish failure log
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          LOG=build/build.log
          [[ -f "$LOG" ]] || { echo "no build.log captured"; exit 0; }

          {
            echo "### swift build failed"
            echo
            echo "Run: $RUN_URL"
            echo
            echo '<details><summary>Last 200 lines of build/build.log</summary>'
            echo
            echo '```'
            tail -n 200 "$LOG"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${PR_NUMBER:-}" ]]; then
            body=$(
              {
                echo "swift build failed on commit ${GITHUB_SHA::7}."
                echo
                echo "Run: $RUN_URL"
                echo
                echo '<details><summary>Last 200 lines of build/build.log</summary>'
                echo
                echo '```'
                tail -n 200 "$LOG"
                echo '```'
                echo '</details>'
              }
            )
            # Use a heredoc body to avoid shell quoting pitfalls.
            jq -n --arg body "$body" '{body: $body}' \
              | curl -sSL \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
                  > /dev/null
          fi

      - name: Capture screenshots
        # Best-effort: GUI capture on a hosted runner can be blocked by
        # TCC or run without a window server. Never fail the build for
        # it — the DMG is the deliverable, screenshots are a bonus.
        continue-on-error: true
        run: |
          set -x
          mkdir -p build/screenshots

          # Capture one window per mode. Each mode gets its own launch
          # rather than being clicked through with accessibility
          # automation, which failed silently and captured the same
          # pane twice.
          capture () {
            local mode="$1" out="$2" extra="${3:-}"
            # $extra is intentionally unquoted: it carries additional
            # flag/value pairs that must word-split.
            open build/PDFHandler.app --args --screenshot-demo --screenshot-mode "$mode" $extra
            sleep 10
            osascript -e 'tell application "System Events" to set frontmost of process "PDFHandler" to true' || true
            sleep 2

            # Window-only shot via its geometry rather than `-l <id>`:
            # System Events window ids are not CGWindowIDs.
            local geom
            geom=$(osascript -e 'tell application "System Events" to tell process "PDFHandler" to get {position of window 1, size of window 1}' 2>/dev/null | tr -d ' ' || echo "")
            if [[ "$geom" =~ ^-?[0-9]+,-?[0-9]+,[0-9]+,[0-9]+$ ]]; then
              screencapture -x -R "$geom" "build/screenshots/$out" || true
            else
              echo "could not read window geometry for $mode: '$geom'"
              screencapture -x "build/screenshots/$out" || true
            fi

            osascript -e 'tell application "PDFHandler" to quit' || killall PDFHandler || true
            sleep 3
          }

          capture sign     01-sign.png
          capture compress 02-compress.png
          capture merge    03-merge.png
          capture convert  04-convert.png
          # Text field selected, so the typography inspector is in frame.
          capture sign     05-text-inspector.png "--screenshot-select freetext"

          ls -la build/screenshots || true

          # Distinctness check: identical byte sizes across modes mean
          # the mode switch silently did nothing, which is exactly the
          # failure this rewrite fixes. Report it rather than shipping
          # duplicate images that look like success.
          shasum -a 256 build/screenshots/*.png || true

          # Emit a downscaled preview into the log. The artifact blob
          # host is unreachable from some environments, so this is the
          # only channel that always survives.
          for shot in 01-sign 02-compress 05-text-inspector; do
            src="build/screenshots/${shot}.png"
            [[ -f "$src" ]] || continue
            sips -Z 560 -s format jpeg -s formatOptions 45 "$src" --out "/tmp/${shot}.jpg" >/dev/null 2>&1 || continue
            echo "----BEGIN-PREVIEW ${shot}----"
            base64 -i "/tmp/${shot}.jpg" | tr -d '\n' | fold -w 240
            echo ""
            echo "----END-PREVIEW ${shot}----"
          done

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Locate DMG
        id: locate
        run: |
          dmg="$(ls build/PDFHandler-*.dmg | head -n1)"
          echo "dmg_path=$dmg" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.dmg_name }}
          path: ${{ steps.locate.outputs.dmg_path }}
          if-no-files-found: error

      - name: Attach DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dmg_path }}
          generate_release_notes: true
