name: Build DMG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # attach DMG to release on v* tags
  pull-requests: write  # post build log to PR on failure
  issues: write         # pull-request comments go through the issues API

jobs:
  build:
    name: Build PDFHandler.dmg
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p

      - name: Run tests
        run: |
          cd PDFHandler
          swift test

      - name: Build DMG (capturing log)
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/build-dmg.sh 2>&1 | tee build/build.log

      - name: Publish failure log
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          LOG=build/build.log
          [[ -f "$LOG" ]] || { echo "no build.log captured"; exit 0; }

          {
            echo "### swift build failed"
            echo
            echo "Run: $RUN_URL"
            echo
            echo '<details><summary>Last 200 lines of build/build.log</summary>'
            echo
            echo '```'
            tail -n 200 "$LOG"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${PR_NUMBER:-}" ]]; then
            body=$(
              {
                echo "swift build failed on commit ${GITHUB_SHA::7}."
                echo
                echo "Run: $RUN_URL"
                echo
                echo '<details><summary>Last 200 lines of build/build.log</summary>'
                echo
                echo '```'
                tail -n 200 "$LOG"
                echo '```'
                echo '</details>'
              }
            )
            # Use a heredoc body to avoid shell quoting pitfalls.
            jq -n --arg body "$body" '{body: $body}' \
              | curl -sSL \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
                  > /dev/null
          fi

      - name: Capture screenshots
        # Best-effort: GUI capture on a hosted runner can be blocked by
        # TCC or run without a window server. Never fail the build for
        # it — the DMG is the deliverable, screenshots are a bonus.
        continue-on-error: true
        run: |
          set -x
          mkdir -p build/screenshots

          # Populated demo state (synthetic agreement + placed fields).
          open build/PDFHandler.app --args --screenshot-demo
          sleep 12

          osascript -e 'tell application "System Events" to set frontmost of process "PDFHandler" to true' || true
          sleep 3

          screencapture -x build/screenshots/01-sign-mode.png || true

          # Window-only shot, cropping out the runner's desktop. Uses
          # the window's geometry rather than `-l <id>`: System Events
          # window ids are not CGWindowIDs, so -l would not match.
          geom=$(osascript -e 'tell application "System Events" to tell process "PDFHandler" to get {position of window 1, size of window 1}' 2>/dev/null | tr -d ' ' || echo "")
          if [[ "$geom" =~ ^-?[0-9]+,-?[0-9]+,[0-9]+,[0-9]+$ ]]; then
            screencapture -x -R "$geom" build/screenshots/02-sign-window.png || true
          else
            echo "could not read window geometry: '$geom'"
          fi

          # Switch to Compress mode via the sidebar for a second view.
          osascript <<'APPLESCRIPT' || true
          tell application "System Events"
            tell process "PDFHandler"
              set frontmost to true
              delay 1
              try
                click static text "Compress" of window 1
              end try
            end tell
          end tell
          APPLESCRIPT
          sleep 2
          screencapture -x build/screenshots/03-compress-mode.png || true

          osascript -e 'tell application "PDFHandler" to quit' || killall PDFHandler || true
          ls -la build/screenshots || true

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Locate DMG
        id: locate
        run: |
          dmg="$(ls build/PDFHandler-*.dmg | head -n1)"
          echo "dmg_path=$dmg" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.dmg_name }}
          path: ${{ steps.locate.outputs.dmg_path }}
          if-no-files-found: error

      - name: Attach DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dmg_path }}
          generate_release_notes: true
